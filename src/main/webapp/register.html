<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Home Automation</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a,
                    #2563eb
                );

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;

            background: white;

            padding: 38px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background: #16a34a;

            color: white;

            font-size: 30px;
        }

        h1 {
            text-align: center;

            color: #0f172a;

            font-size: 27px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #16a34a;

            box-shadow:
                0 0 0 3px rgba(22, 163, 74, 0.12);
        }

        .register-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #15803d
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .register-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(22, 163, 74, 0.3);
        }

        .back-section {
            margin-top: 22px;

            text-align: center;
        }

        .back-button {
            display: block;

            padding: 12px;

            border-radius: 10px;

            text-decoration: none;

            background: #f1f5f9;

            color: #475569;

            border: 1px solid #e2e8f0;

            font-weight: bold;

            transition: 0.2s;
        }

        .back-button:hover {
            background: #e2e8f0;
        }

        .footer {
            text-align: center;

            margin-top: 22px;

            color: #94a3b8;

            font-size: 13px;
        }

        @media (max-width: 480px) {

            .container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="logo">
            👤
        </div>


        <h1>
            Create New Account
        </h1>


        <p class="subtitle">
            Join your Home Automation System
        </p>


        <form action="register" method="post">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-button"
            >
                ✨ Create Account
            </button>

        </form>


        <div class="back-section">

            <a
                href="login.html"
                class="back-button"
            >
                ← Back to Login
            </a>

        </div>


        <div class="footer">

            Home Automation Monitoring System

        </div>

    </div>

</body>

</html>
